# The NBA props daily job (docs/DAILY_JOB.md): grades past days, takes each game's pre-tip
# checkpoints, logs paper tickets, commits bets/ and the day's rotations, and sends alerts.
# Research only: nothing here places an order.
#
# Secrets (Settings > Secrets and variables > Actions):
#   SPORTS_ODDS_API_KEY  required for odds, results and box scores
#   NTFY_TOPIC           optional: phone alerts through ntfy
# Variable (optional): COLD_START_BANKROLL_USD for suggested sizes (default 5000).
name: NBA daily job

on:
  schedule:
    # Times are UTC. Hourly through the day (the morning grade, the slate, t-6h / t-2h reads),
    # then every 30 minutes across the evening tip window, so most games get a read about 40 and
    # about 10 minutes before tip. GitHub can start a scheduled run late; a checkpoint that's due
    # is taken late, never after tip.
    - cron: "50 15-21 * * *"
    - cron: "20,50 22-23 * * *"
    - cron: "20,50 0-3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # The decision log (git-ignored) lives in the Actions cache between runs. Each run saves a
      # new entry and restores the newest; the committed bets/ folder is the durable record.
      - name: Restore the decision log
        uses: actions/cache/restore@v4
        with:
          path: |
            data/edge_lab.duckdb*
            data/daily_state.json
          key: nba-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nba-db-

      - name: Run the daily job
        env:
          SPORTS_ODDS_API_KEY: ${{ secrets.SPORTS_ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          COLD_START_BANKROLL_USD: ${{ vars.COLD_START_BANKROLL_USD || '5000' }}
        run: python -m cold_start_usage.cli daily

      - name: Save the decision log
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/edge_lab.duckdb*
            data/daily_state.json
          key: nba-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit the journal and rotations
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bets cold_start_usage/scenarios
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -q -m "Daily job: journal and rotations, $(TZ=America/New_York date '+%Y-%m-%d %H:%M') ET"
          for attempt in 1 2 3; do
            if git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
