[project]
name = "cold-start-usage-projection-modeling"
version = "1.0.0"
description = "NBA player-points projections vs a sportsbook consensus, with a prediction-market watchlist (research only)"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "duckdb>=1.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["cold_start_usage"]

[tool.setuptools.package-data]
cold_start_usage = ["scenarios/*.csv", "scenarios/auto/*.csv", "books.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
